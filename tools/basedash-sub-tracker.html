<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basedash Subscription Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col justify-center items-center">
    
    <!-- Top Header Navigation & Language Switcher -->
    <header class="w-full max-w-2xl flex justify-between items-center mb-4 px-1">
        <a href="../index.html" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-left"></i> Kembali / Back
        </a>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-globe text-slate-400 text-xs"></i>
            <select id="toolLangSelect" onchange="changeToolLanguage(this.value)" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="en">🌐 English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
                <option value="ja">日本語</option>
                <option value="ar">العربية</option>
                <option value="id">Bahasa Indonesia</option>
            </select>
        </div>
    </header>

    <main class="w-full max-w-2xl bg-slate-800 p-6 sm:p-8 rounded-xl shadow-2xl border border-slate-700">
        <div class="mb-6 border-b border-slate-700 pb-4">
            <h1 id="toolTitle" class="text-2xl font-bold text-indigo-400 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> Basedash Subscription Manager
            </h1>
            <p id="toolDesc" class="text-slate-400 text-sm">Manages subscriptions and tracks next delivery dates.</p>
        </div>

        <form id="toolForm" onsubmit="handleExecute(event)" class="space-y-5">
            <div id="app" class="space-y-4"></div>
            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-500/20 flex justify-center items-center gap-2">
                <span>Jalankan Tool</span>
            </button>
        </form>

        <div id="resultBox" class="mt-6 hidden p-4 bg-slate-950 rounded-lg border border-slate-700">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hasil Eksekusi:</h3>
            <pre id="resultOutput" class="text-sm text-green-400 overflow-x-auto whitespace-pre-wrap font-mono"></pre>
        </div>
    </main>

    <script src="../assets/js/tools/basedash-sub-tracker.js"></script>

    <script>
        const schemaFields = [];
        const i18nMap = {"en":{"title":"Basedash Subscription Manager","description":"Manages subscriptions and tracks next delivery dates."},"es":{"title":"","description":""}};
        const toolIconClass = "fa-solid fa-clock-rotate-left";

        function initLanguage() {
            const savedLang = localStorage.getItem('app_lang') || localStorage.getItem('selectedLang') || 'id';
            const selectEl = document.getElementById('toolLangSelect');
            if (selectEl) selectEl.value = savedLang;
            applyLanguage(savedLang);
        }

        function changeToolLanguage(lang) {
            localStorage.setItem('app_lang', lang);
            localStorage.setItem('selectedLang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const langData = i18nMap[lang] || i18nMap['en'] || i18nMap['id'] || {};
            const titleEl = document.getElementById('toolTitle');
            const descEl = document.getElementById('toolDesc');

            if (titleEl && langData.title) {
                titleEl.innerHTML = `<i class="${toolIconClass}"></i> ${langData.title}`;
            }
            if (descEl && langData.description) {
                descEl.innerText = langData.description;
            }

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }
        }

        function renderForm() {
            const container = document.getElementById('app');
            if (!schemaFields || schemaFields.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-xs italic">Tool ini dapat dijalankan langsung tanpa parameter input.</p>';
                return;
            }

            container.innerHTML = schemaFields.map(f => {
                const label = f.label || f.label_id || f.label_en || f.name;
                const ph = f.placeholder ? `placeholder="${f.placeholder}"` : '';
                const req = f.required !== false ? 'required' : '';

                if (f.type === 'select' && f.options) {
                    const opts = f.options.map(o => {
                        const val = typeof o === 'object' ? o.value : o;
                        const lbl = typeof o === 'object' ? (o.label || o.value) : o;
                        return `<option value="${val}">${lbl}</option>`;
                    }).join('');
                    return `<div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">${label}</label>
                        <select name="${f.name}" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none" ${req}>${opts}</select>
                    </div>`;
                }

                if (f.type === 'textarea') {
                    return `<div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">${label}</label>
                        <textarea name="${f.name}" rows="3" ${ph} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none" ${req}></textarea>
                    </div>`;
                }

                return `<div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">${label}</label>
                    <input type="${f.type || 'text'}" name="${f.name}" ${ph} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none" ${req} />
                </div>`;
            }).join('');
        }

        async function handleExecute(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const resBox = document.getElementById('resultBox');
            const resOut = document.getElementById('resultOutput');
            
            const formData = new FormData(e.target);
            const inputs = {};
            formData.forEach((value, key) => inputs[key] = value);

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> <span>Memproses...</span>';

            try {
                if (typeof executeTool !== 'function') throw new Error('Fungsi executeTool() tidak ditemukan pada file JS engine.');
                const res = await executeTool(inputs);
                resBox.classList.remove('hidden');
                
                if (typeof res === 'object') {
                    resOut.innerText = JSON.stringify(res.result !== undefined ? res.result : res, null, 2);
                } else {
                    resOut.innerText = String(res);
                }
            } catch (err) {
                resBox.classList.remove('hidden');
                resOut.innerText = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Jalankan Tool</span>';
            }
        }

        renderForm();
        initLanguage();
    </script>
</body>
</html>
