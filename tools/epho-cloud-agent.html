<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epho Cloud Agent Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 flex flex-col justify-center items-center">
    <header class="w-full max-w-2xl flex justify-between items-center mb-4 px-1">
        <a href="../index.html" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-left"></i> <span id="navBackText">Back</span>
        </a>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-globe text-slate-400 text-xs"></i>
            <select id="toolLangSelect" onchange="changeToolLanguage(this.value)" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                <option value="en">🌐 English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
                <option value="ja">日本語</option>
                <option value="ar">العربية</option>
                <option value="id">Bahasa Indonesia</option>
            </select>
        </div>
    </header>

    <main class="w-full max-w-2xl bg-slate-800 p-6 sm:p-8 rounded-xl shadow-2xl border border-slate-700">
        <div class="mb-6 border-b border-slate-700 pb-4">
            <h1 id="toolTitle" class="text-2xl font-bold text-indigo-400 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> Epho Cloud Agent Runner
            </h1>
            <p id="toolDesc" class="text-slate-400 text-sm">Source content not provided (JS reference detected)</p>
        </div>

        <form id="toolForm" onsubmit="handleExecute(event)" class="space-y-5">
            <div id="app" class="space-y-4"></div>
            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-play text-xs"></i>
                <span id="btnSubmitText">Execute Tool</span>
            </button>
        </form>

        <div id="resultBox" class="mt-6 hidden p-4 bg-slate-950 rounded-lg border border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Output Result:</h3>
                <button onclick="copyResult()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> <span id="copyBtnText">Copy</span>
                </button>
            </div>
            <div id="resultOutput" class="text-sm text-green-400 overflow-x-auto whitespace-pre-wrap font-mono bg-slate-900/50 p-3 rounded border border-slate-800"></div>
        </div>

        <div id="guideSection" class="mt-8 pt-6 border-t border-slate-700">
            <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-indigo-400"></i>
                <span id="guideTitleText">User Guide</span>
            </h3>
            <ol id="guideSteps" class="list-decimal list-inside space-y-1.5 text-xs text-slate-400 mb-4 leading-relaxed"></ol>
            <div id="guideTipsBox" class="p-3 bg-indigo-950/40 border border-indigo-800/50 rounded-lg text-xs text-indigo-300 hidden flex items-start gap-2">
                <i class="fa-solid fa-lightbulb text-amber-400 mt-0.5"></i>
                <div><span class="font-semibold">Tips:</span> <span id="guideTips"></span></div>
            </div>
        </div>
    </main>

    <script>
        function executeTool(inputs) {
  try {
    if (!inputs.repo_url || inputs.repo_url.trim() === '') {
      return '<div class="p-3 bg-red-50 text-red-600 rounded-lg">Error: Repository URL is required.</div>';
    }
    if (!inputs.model_type) {
      return '<div class="p-3 bg-yellow-50 text-yellow-700 rounded-lg">Warning: Please select an AI Agent model.</div>';
    }
    const task = inputs.task_description || 'No specific task provided.';
    const agentName = inputs.model_type.toUpperCase();
    return `<div class="p-4 bg-slate-50 text-slate-800 rounded-xl font-mono">
      <h3 class="font-bold mb-2">${agentName} Agent Simulation</h3>
      <p class="mb-2"><strong>Target:</strong> ${inputs.repo_url}</p>
      <p class="mb-4"><strong>Task:</strong> ${task}</p>
      <div class="bg-blue-100 p-2 rounded text-sm">Status: Connecting to Cloud Environment...</div>
      <div class="mt-2 bg-emerald-100 p-2 rounded text-sm">Result: Execution Successful (Mock)</div>
    </div>`;
  } catch (err) {
    return '<div class="p-3 bg-red-50 text-red-600 rounded-lg">Execution Error: ' + err.message + '</div>';
  }
}
    </script>

    <script>
        const schemaFields = [{"name":"repo_url","type":"text","label":"Repository URL","placeholder":"https://github.com/user/repo"},{"name":"model_type","type":"select","label":"Select AI Agent","options":[{"label":"Claude Code","value":"claude"},{"label":"Codex","value":"codex"},{"label":"Opencode","value":"opencode"}]},{"name":"task_description","type":"textarea","label":"Task Description","placeholder":"Describe the code task..."}];
        const i18nMap = {"en":{"title":"","description":"Source content not provided (JS reference detected)","steps":[],"tips":""},"id":{"title":"","description":"Konten sumber tidak disediakan (Referensi JS terdeteksi)","steps":[],"tips":""},"es":{"title":"","description":"Contenido de origen no proporcionado (Referencia JS detectada)","steps":[],"tips":""},"de":{"title":"","description":"Inhalt nicht bereitgestellt (JS-Referenz erkannt)","steps":[],"tips":""},"fr":{"title":"","description":"Contenu source non fourni (Référence JS détectée)","steps":[],"tips":""},"pt":{"title":"","description":"Conteúdo de origem não fornecido (Referência JS detectada)","steps":[],"tips":""},"ja":{"title":"","description":"ソースコンテンツが提供されていません (JS リファレンス検出)","steps":[],"tips":""},"ar":{"title":"","description":"لم يتم توفير محتوى المصدر (تم اكتشاف مرجع JS)","steps":[],"tips":""}};
        const guideMap = {"en":{"title":"","description":"Source content not provided (JS reference detected)","steps":[],"tips":""},"id":{"title":"","description":"Konten sumber tidak disediakan (Referensi JS terdeteksi)","steps":[],"tips":""},"es":{"title":"","description":"Contenido de origen no proporcionado (Referencia JS detectada)","steps":[],"tips":""},"de":{"title":"","description":"Inhalt nicht bereitgestellt (JS-Referenz erkannt)","steps":[],"tips":""},"fr":{"title":"","description":"Contenu source non fourni (Référence JS détectée)","steps":[],"tips":""},"pt":{"title":"","description":"Conteúdo de origem não fornecido (Referência JS detectada)","steps":[],"tips":""},"ja":{"title":"","description":"ソースコンテンツが提供されていません (JS リファレンス検出)","steps":[],"tips":""},"ar":{"title":"","description":"لم يتم توفير محتوى المصدر (تم اكتشاف مرجع JS)","steps":[],"tips":""}};
        const toolIconClass = "fa-solid fa-robot";

        function renderFormFields(currentLang) {
            const appEl = document.getElementById('app');
            if (!appEl) return;
            if (!schemaFields || schemaFields.length === 0) {
                appEl.innerHTML = '<p class="text-xs text-slate-500">No input fields required.</p>';
                return;
            }
            appEl.innerHTML = schemaFields.map(field => {
                const name = field.name || 'field';
                const type = field.type || 'text';
                let label = (typeof field.label === 'object') ? (field.label[currentLang] || field.label.en || field.label.id) : field.label;
                if (!label) label = name.replace(/_/g, ' ').toUpperCase();
                const placeholder = field.placeholder || '';

                if (type === 'textarea') {
                    return '<div class="space-y-1">' +
                           '<label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">' + label + '</label>' +
                           '<textarea name="' + name + '" placeholder="' + placeholder + '" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 h-28 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"></textarea>' +
                           '</div>';
                } else if (type === 'select' && Array.isArray(field.options)) {
                    const optionsHtml = field.options.map(opt => '<option value="' + opt.value + '">' + opt.label + '</option>').join('');
                    return '<div class="space-y-1">' +
                           '<label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">' + label + '</label>' +
                           '<select name="' + name + '" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">' + optionsHtml + '</select>' +
                           '</div>';
                }

                return '<div class="space-y-1">' +
                       '<label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">' + label + '</label>' +
                       '<input type="' + type + '" name="' + name + '" placeholder="' + placeholder + '" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">' +
                       '</div>';
            }).join('');
        }

        function changeToolLanguage(lang) {
            localStorage.setItem('user_lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const langData = i18nMap[lang] || i18nMap['en'] || {};
            const guideData = guideMap[lang] || guideMap['en'] || {};
            renderFormFields(lang);
            const titleEl = document.getElementById('toolTitle');
            const descEl = document.getElementById('toolDesc');
            if (titleEl && langData.title) titleEl.innerHTML = '<i class="' + toolIconClass + '"></i> ' + langData.title;
            if (descEl && langData.description) descEl.innerText = langData.description;
            const stepsEl = document.getElementById('guideSteps');
            const tipsBox = document.getElementById('guideTipsBox');
            const tipsEl = document.getElementById('guideTips');
            if (stepsEl && guideData.steps) {
                stepsEl.innerHTML = guideData.steps.map(step => '<li>' + step + '</li>').join('');
            }
            if (tipsEl && guideData.tips) {
                tipsEl.innerText = guideData.tips;
                tipsBox.classList.remove('hidden');
            }
        }

        async function handleExecute(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const inputs = Object.fromEntries(formData.entries());
            const resBox = document.getElementById('resultBox');
            const resOut = document.getElementById('resultOutput');
            try {
                const res = await executeTool(inputs);
                resBox.classList.remove('hidden');
                if (typeof res === 'string' && res.trim().startsWith('<')) {
                    resOut.innerHTML = res;
                } else if (typeof res === 'object') {
                    resOut.innerText = JSON.stringify(res, null, 2);
                } else {
                    resOut.innerText = res;
                }
            } catch (err) {
                resBox.classList.remove('hidden');
                resOut.innerText = 'Execution Error: ' + err.message;
            }
        }

        function copyResult() {
            const resOut = document.getElementById('resultOutput');
            if (!resOut) return;
            navigator.clipboard.writeText(resOut.innerText || resOut.textContent);
            const copyBtnText = document.getElementById('copyBtnText');
            if (copyBtnText) {
                copyBtnText.innerText = 'Copied!';
                setTimeout(() => { copyBtnText.innerText = 'Copy'; }, 2000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('user_lang') || 'en';
            const langSelect = document.getElementById('toolLangSelect');
            if (langSelect) langSelect.value = savedLang;
            applyLanguage(savedLang);
        });
    </script>
</body>
</html>
