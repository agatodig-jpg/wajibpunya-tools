<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool | WajibPunya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="p-4 border-b bg-white flex justify-between items-center max-w-4xl w-full mx-auto">
    <a href="/" class="text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog
    </a>
    <span id="tool-category" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 font-medium text-slate-600">Loading...</span>
  </header>

  <!-- Container Tool Dinamis -->
  <main class="max-w-2xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">
    <div id="tool-container" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h1 id="tool-title" class="text-2xl font-bold mb-2 text-slate-900">Memuat Tool...</h1>
      <p id="tool-desc" class="text-slate-500 text-sm mb-6"></p>
      
      <!-- Area Form / Interaksi Tool -->
      <div id="tool-app"></div>
    </div>
  </main>

  <!-- Script Penanganan Routing & Render Aman -->
  <script>
    async function initTool() {
      const params = new URLSearchParams(window.location.search);
      const toolId = params.get('id');

      if (!toolId) {
        window.location.href = '/';
        return;
      }

      try {
        // Menggunakan path absolut berbasis domain root agar stabil di semua halaman
        const response = await fetch(`${window.location.origin}/tools.json`);
        if (!response.ok) throw new Error('Gagal mengambil file konfigurasi tools.json');

        const data = await response.json();
        const toolsArray = Array.isArray(data) ? data : (data.tools || []);
        const toolConfig = toolsArray.find(t => t.id === toolId);

        if (!toolConfig) {
          document.getElementById('tool-title').innerText = 'Tool Tidak Ditemukan';
          document.getElementById('tool-desc').innerText = 'Tool yang Anda cari tidak terdaftar dalam direktori.';
          document.getElementById('tool-category').innerText = 'Error';
          return;
        }

        // Render Metadata
        document.title = `${toolConfig.title} | WajibPunya`;
        document.getElementById('tool-title').innerText = toolConfig.title;
        document.getElementById('tool-desc').innerText = toolConfig.description || 'Utility tool for automation and productivity.';
        document.getElementById('tool-category').innerText = toolConfig.category || 'Utility';

        // Muat Antarmuka Tool
        loadToolLogic(toolId);
      } catch (err) {
        console.error('Gagal memuat konfigurasi tool:', err);
        document.getElementById('tool-title').innerText = 'Gagal Memuat Konfigurasi';
        document.getElementById('tool-desc').innerText = err.message;
      }
    }

    function loadToolLogic(id) {
      const appArea = id === 'ai-observability-tracker' ? document.getElementById('tool-app') : null;
      
      if (!appArea) return;

      appArea.innerHTML = `
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-700">Metric Name</label>
            <input type="text" id="metric-name" placeholder="e.g. Latency, Accuracy..." class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-700">Current Value</label>
            <input type="number" id="current-val" placeholder="0" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-700">Previous Value</label>
            <input type="number" id="previous-val" placeholder="0" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="runTracker()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Track Metric</button>
          <div id="result" class="hidden p-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-900 text-sm"></div>
        </div>
      `;
    }

    function runTracker() {
      const metricName = document.getElementById('metric-name').value;
      const curVal = parseFloat(document.getElementById('current-val').value) || 0;
      const prevVal = parseFloat(document.getElementById('previous-val').value) || 0;
      const resDiv = document.getElementById('tool-app').querySelector('#result');

      let pctChange = '0';
      if (prevVal !== 0) {
        pctChange = (((curVal - prevVal) / Math.abs(prevVal)) * 100).toFixed(2);
      }

      resDiv.classList.remove('hidden');
      resDiv.innerHTML = `<strong>Metric:</strong> ${metricName}<br><strong>Current:</strong> ${curVal}<br><strong>Change:</strong> ${pctChange}%`;
    }

    window.addEventListener('DOMContentLoaded', initTool);
  </script>
</body>
</html>
