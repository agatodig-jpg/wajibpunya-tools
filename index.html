<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WajibPunya | Global Micro-Software Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- HEADER BARU (DARK NAVY) -->
  <header class="bg-slate-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="text-2xl font-black tracking-tighter">WajibPunya<span class="text-indigo-400">.</span></div>
      <div class="space-x-4 text-sm font-medium text-slate-300">
        <a href="#" class="hover:text-white">Dashboard</a>
        <a href="#" class="hover:text-white">API</a>
      </div>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="bg-white py-12 text-center border-b">
    <h1 class="text-4xl font-black text-slate-900 mb-2">Micro-Software Directory</h1>
    <p class="text-slate-500 mb-6">Optimized for global efficiency & automation.</p>
    <input type="text" placeholder="Search engines..." class="w-full max-w-md p-3 border rounded-lg bg-slate-50 border-slate-300">
  </section>

  <!-- CONTENT GRID -->
  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- ITEM 1 -->
        <div class="p-6 bg-white border border-slate-200 rounded-xl hover:shadow-xl transition shadow-sm">
          <div class="text-indigo-500 text-2xl mb-2"><i class="fa-solid fa-calculator"></i></div>
          <h3 class="font-bold">ROI Calculator</h3>
          <p class="text-xs text-slate-500 mt-1">Dropshipping margin analysis.</p>
        </div>
      </div>
    </div>
    
    <!-- SIDEBAR -->
    <aside class="bg-white p-6 rounded-xl border border-dashed border-slate-300 h-64 flex items-center justify-center text-slate-400">
      [ Sidebar Ad Space ]
    </aside>
  </main>

</body>
</html>
