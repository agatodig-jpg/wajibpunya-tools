<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WajibPunya - Micro-Software & Web Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-900 flex flex-col min-h-screen">

  <!-- Header Section -->
  <header class="flex justify-end p-4 text-sm text-gray-600 gap-4">
    <a href="#about" class="hover:underline">About</a>
    <a href="#api" class="hover:underline">API & Webhooks</a>
  </header>

  <!-- Main Engine Area -->
  <main class="flex-grow flex flex-col items-center justify-center px-4 -mt-16">
    <!-- Brand Logo / Name -->
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-8">
      WajibPunya<span class="text-blue-600">.</span>
    </h1>

    <!-- Google-Style Search Box -->
    <div class="w-full max-w-xl relative">
      <div class="flex items-center border border-gray-300 rounded-full px-4 py-3 shadow-sm hover:shadow-md focus-within:shadow-md focus-within:border-gray-400 transition">
        <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          type="text" 
          id="searchInput"
          onkeyup="filterTools()"
          placeholder="Search micro-software, calculators, utilities..." 
          class="w-full outline-none bg-transparent text-gray-800 placeholder-gray-400"
        />
      </div>

      <!-- Live Search Results Dropdown -->
      <div id="searchResults" class="hidden absolute top-full left-0 right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden z-10">
        <!-- Results rendered dynamically via JS -->
      </div>
    </div>

    <!-- Quick Action / Direct Tags -->
    <div class="flex flex-wrap justify-center gap-2 mt-6">
      <a href="/tools/kalkulator-roi-margin-dropship/" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs text-gray-600 transition">
        E-Commerce ROI Calculator
      </a>
      <a href="/tools/kalkulator-zakat-mal/" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs text-gray-600 transition">
        Asset & Wealth Calculator
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-50 border-t border-gray-100 p-4 text-center text-xs text-gray-500">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
      <div>&copy; 2026 WajibPunya Network. Global Micro-Software Infrastructure.</div>
      <div class="flex gap-4">
        <a href="#" class="hover:underline">Privacy</a>
        <a href="#" class="hover:underline">Terms</a>
        <a href="#" class="hover:underline">Status</a>
      </div>
    </div>
  </footer>

  <!-- Instant Client-Side Search Logic -->
  <script>
    const tools = [
      { name: "E-Commerce ROI & Margin Calculator", url: "/tools/kalkulator-roi-margin-dropship/", desc: "Calculate profit margins and BEP for online sales." },
      { name: "Global Wealth & Asset Calculator", url: "/tools/kalkulator-zakat-mal/", desc: "Calculate asset distributions and threshold limits." }
    ];

    function filterTools() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      
      if (!input) {
        resultsContainer.classList.add('hidden');
        return;
      }

      const filtered = tools.filter(tool => 
        tool.name.toLowerCase().includes(input) || 
        tool.desc.toLowerCase().includes(input)
      );

      if (filtered.length > 0) {
        resultsContainer.innerHTML = filtered.map(tool => `
          <a href="${tool.url}" class="block px-4 py-3 hover:bg-gray-50 border-b last:border-0 transition">
            <div class="font-medium text-sm text-blue-600">${tool.name}</div>
            <div class="text-xs text-gray-500">${tool.desc}</div>
          </a>
        `).join('');
        resultsContainer.classList.remove('hidden');
      } else {
        resultsContainer.innerHTML = `<div class="px-4 py-3 text-xs text-gray-400">No micro-software found matching "${input}"</div>`;
        resultsContainer.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
